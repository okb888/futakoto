  <text x="80" y="450" font-family="-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif" font-size="18" letter-spacing="2" fill="#888">忙しい毎日の中で、お互いの「頭の中」を5分だけ共有する</text>
